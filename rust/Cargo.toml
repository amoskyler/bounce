[workspace]
resolver = "2"
members = ["libbounce", "bounce-node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/bounce-chat/bounce"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde = "1.3"
uuid = { version = "1", features = ["v4", "serde"] }
blake3 = "1.5"
ed25519-dalek = { version = "2", features = ["hazmat", "rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
sha2 = "0.10"
sha3 = "0.10"
data-encoding = "2"
rand = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.39", features = ["bundled", "uuid"] }
hex = "0.4"

[profile.release]
# The native module ships inside the app bundle, so size and cross-crate
# inlining both matter more than compile time.
lto = true
strip = "symbols"
