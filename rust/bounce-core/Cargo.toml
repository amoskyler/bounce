[package]
name = "bounce-core"
description = "Bounce protocol and cryptography core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# The real transport. Off by default so the test suite does not pay arti's
# build cost; bounce-node turns it on.
tor = [
    "dep:arti-client",
    "dep:tor-hsservice",
    "dep:tor-hscrypto",
    "dep:tor-llcrypto",
    "dep:tor-proto",
    "dep:tor-cell",
    "dep:tor-rtcompat",
    "dep:safelog",
    "dep:rustls",
    "dep:futures",
]

[dependencies]
serde.workspace = true
serde_bytes.workspace = true
rmp-serde.workspace = true
uuid.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
aes-gcm.workspace = true
sha2.workspace = true
sha3.workspace = true
data-encoding.workspace = true
rand.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
rusqlite.workspace = true
hex.workspace = true
serde_json = "1"
# Engine logs during a failing transfer are the only way to see which frame
# was rejected; the subscriber cannot live in `bounce-node` because loading it
# into Node kills the process.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tor, via arti. Pinned exactly: `launch_onion_service_with_hsid` sits behind
# arti's `experimental-api` feature and is therefore outside its semver
# guarantees, so a minor bump can move it.
arti-client = { version = "=0.44.0", optional = true, default-features = false, features = [
    "tokio",
    "rustls",
    "compression",
    "flowctl-cc",
    "onion-service-client",
    "onion-service-service",
    "keymgr",
    "experimental-api",
] }
tor-hsservice = { version = "=0.44.0", optional = true }
tor-hscrypto = { version = "=0.44.0", optional = true }
tor-llcrypto = { version = "=0.44.0", optional = true }
tor-proto = { version = "=0.44.0", optional = true }
tor-cell = { version = "=0.44.0", optional = true }
tor-rtcompat = { version = "=0.44.0", optional = true, features = ["tokio", "rustls"] }
safelog = { version = "=0.9.0", optional = true }
# arti leaves the rustls provider unselected; we pick ring explicitly.
rustls = { version = "0.23", optional = true, default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
futures = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"
# `test-util` provides the paused clock the handshake-timeout test needs.
tokio = { workspace = true, features = ["test-util"] }
serde_json = "1"
