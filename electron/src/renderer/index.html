<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bounce</title>
    <!--
      The renderer loads nothing from the network: no fonts, no scripts, no
      images. Everything is bundled, so this policy can forbid remote origins
      outright rather than allow-listing them.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="index.js"></script>
  </body>
</html>
